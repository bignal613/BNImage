<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>BNImage · 统一查看器</title>
<script>
/* 系统标题栏不跟界面的浅/深色走（它只跟 Windows 系统主题）。
   这里在样式之前就把当前主题报给后端，让它先把标题栏染色，
   避免开窗瞬间出现「上面白、下面黑」。 */
(function () {
  try {
    var q = new URLSearchParams(location.search).get('theme');
    var t = (q === 'light' || q === 'dark') ? q : localStorage.getItem('bnimage.theme');
    if (t !== 'light' && t !== 'dark') {
      t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    /* 首帧就把主题定下来，免得先闪一下深色再变浅 */
    document.documentElement.setAttribute('data-theme', t);
    fetch('/api/theme?mode=' + t, { cache: 'no-store' }).catch(function () {});
  } catch (e) { /* 浏览器里直接打开时没有后端，忽略 */ }
})();
</script>
<link rel="stylesheet" href="/static/style.css?v=0">
<link rel="stylesheet" href="/static/editor.css?v=0">
</head>
<body>

<header id="bar">
  <div class="lead">
    <button class="icon-btn" id="btnLocate" title="输入路径  Ctrl+L" aria-label="输入路径">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M3.5 7.5A1.5 1.5 0 0 1 5 6h4.2l1.6 2H19a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 19 18H5a1.5 1.5 0 0 1-1.5-1.5v-9Z"/>
      </svg>
    </button>
    <nav id="crumbs" class="crumbs"></nav>
    <span id="count" class="count"></span>
  </div>
  <div class="tail">
    <button class="icon-btn" id="btnGrid" title="网格视图  G" aria-label="网格视图">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <rect x="4" y="4" width="6.4" height="6.4"/><rect x="13.6" y="4" width="6.4" height="6.4"/>
        <rect x="4" y="13.6" width="6.4" height="6.4"/><rect x="13.6" y="13.6" width="6.4" height="6.4"/>
      </svg>
    </button>
    <button class="icon-btn" id="btnTheme" title="切换明暗" aria-label="切换明暗">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 3.2v1.9M12 18.9v1.9M3.2 12h1.9M18.9 12h1.9M5.9 5.9l1.35 1.35M16.75 16.75l1.35 1.35M18.1 5.9l-1.35 1.35M7.25 16.75 5.9 18.1"/>
      </svg>
    </button>
    <button class="icon-btn" id="btnInfo" title="关于与支持格式  ?" aria-label="关于">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <circle cx="12" cy="12" r="8.2"/><path d="M12 11v5.2"/><circle cx="12" cy="8.1" r=".9" fill="currentColor" stroke="none"/>
      </svg>
    </button>
  </div>
</header>

<div id="locate" class="locate" hidden>
  <input id="locateInput" type="text" spellcheck="false" autocomplete="off"
         placeholder="粘贴或输入文件夹路径，回车打开">
</div>

<main id="stage">
  <section id="grid" class="grid" aria-label="文件网格"></section>
  <section id="viewer" class="viewer" hidden>
    <button class="viewer-close" id="btnClose" title="返回网格  Esc" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M14.5 5.5 8 12l6.5 6.5"/>
      </svg>
    </button>
    <button class="viewer-edit" id="zbEdit" title="编辑这张图  E" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 19.5h4l10-10a2.1 2.1 0 0 0-3-3l-10 10v3Z"/>
        <path d="M14.6 6.4 17.6 9.4"/>
      </svg>
      <span>编辑</span>
    </button>
    <div class="viewer-stage" id="viewerStage"></div>
    <div class="nav-zone left" id="navPrev" title="上一张  ←">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.6 5.6 8.1 12l6.5 6.4"/>
      </svg>
    </div>
    <div class="nav-zone right" id="navNext" title="下一张  →">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.4 5.6 15.9 12l-6.5 6.4"/>
      </svg>
    </div>
    <div class="viewer-info" id="viewerInfo"></div>
    <div class="zoom-bar" id="zoomBar" hidden>
      <button class="zb-btn" id="zbOut" title="缩小  −" aria-label="缩小">−</button>
      <button class="zb-pct" id="zbPct" title="回到原始大小">100%</button>
      <button class="zb-btn" id="zbIn" title="放大  +" aria-label="放大">+</button>
      <span class="zb-sep"></span>
      <button class="zb-btn zb-text" id="zbFit" title="适应窗口  0">适应</button>
      <button class="zb-btn zb-text" id="zbOne" title="原始大小  1">1:1</button>
    </div>
  </section>
</main>

<div id="empty" class="empty">
  <div class="empty-mark">
    <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1">
      <rect x="5.5" y="10.5" width="37" height="27"/>
      <circle cx="17" cy="20" r="2.6"/>
      <path d="m9 33 9.5-9 6.5 6 5-4.5L40 33"/>
    </svg>
  </div>
  <p class="empty-title">选一个位置开始</p>
  <p class="empty-sub">点左上角进入此电脑，或按 <kbd>Ctrl</kbd> <kbd>L</kbd> 粘贴文件夹路径 · <kbd>?</kbd> 查看支持格式</p>
</div>

<div id="panel" class="panel" hidden>
  <div class="panel-body" id="panelBody"></div>
</div>

<div id="toast" class="toast"></div>

<!-- ---------------------------------------------------------- 图片编辑 -->
<div id="editor" class="editor" hidden>
  <header class="ed-bar">
    <div class="ed-head">
      <button class="ed-icon" id="edBack" title="退出编辑  Esc" aria-label="退出编辑">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.5 5.5 8 12l6.5 6.5"/>
        </svg>
      </button>
      <div class="ed-meta">
        <span class="ed-name" id="edName"></span>
        <span class="ed-dim" id="edDim"></span>
      </div>
    </div>

    <div class="ed-tools" id="edTools" role="tablist">
      <button class="ed-tool" data-tool="crop" role="tab" title="裁剪  C">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M7 3v14h14M3 7h14v14"/>
        </svg><span>裁剪</span>
      </button>
      <button class="ed-tool" data-tool="light" role="tab" title="影调：亮度·曝光·对比度·阴影·饱和度  L">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>
        </svg><span>亮度</span>
      </button>
      <button class="ed-tool" data-tool="brush" role="tab" title="手绘  B">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5c3.2.6 4.6-1.2 6-3.4 1.6-2.6 3-4.5 5.2-6.6 2.1-2 4.4-3.2 5-2.6.6.6-.5 2.9-2.6 5-2.1 2.2-4 3.6-6.6 5.2-2.2 1.4-4 2.8-3.4 6"/>
        </svg><span>手绘</span>
      </button>
      <button class="ed-tool" data-tool="arrow" role="tab" title="箭头  A">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19 18.5 5.5"/><path d="M11.5 5.2h7.3v7.3"/>
        </svg><span>箭头</span>
      </button>
      <button class="ed-tool" data-tool="text" role="tab" title="文字  V">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round">
          <path d="M5 6V4.5h14V6M12 4.8v14.4M9 19.2h6"/>
        </svg><span>文字</span>
      </button>
    </div>

    <div class="ed-acts">
      <button class="ed-icon" id="edUndo" title="撤销  Ctrl+Z" aria-label="撤销">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 7.5 4 12l4.5 4.5"/><path d="M4.4 12h9.1A5.5 5.5 0 0 1 19 17.5"/>
        </svg>
      </button>
      <button class="ed-icon" id="edRedo" title="重做  Ctrl+Y" aria-label="重做">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15.5 7.5 20 12l-4.5 4.5"/><path d="M19.6 12h-9.1A5.5 5.5 0 0 0 5 17.5"/>
        </svg>
      </button>
      <span class="ed-vsep"></span>
      <button class="ed-btn" id="edReset" title="清除本次全部编辑">还原</button>
      <button class="ed-btn primary" id="edSave" title="保存  Ctrl+S">保存</button>
    </div>
  </header>

  <div class="ed-body">
    <div class="ed-wrap" id="edWrap">
      <div class="ed-box" id="edBox">
        <canvas class="ed-layer" id="edCanvas"></canvas>
        <canvas class="ed-layer" id="edLive"></canvas>
        <div class="ed-crop" id="edCrop" hidden>
          <div class="ed-crop-box" id="edCropBox">
            <i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i>
            <i data-h="w"></i><i data-h="e"></i>
            <i data-h="sw"></i><i data-h="s"></i><i data-h="se"></i>
          </div>
          <span class="ed-crop-tag" id="edCropTag"></span>
        </div>
      </div>
    </div>
    <aside class="ed-side" id="edSide"></aside>
  </div>

  <div class="ed-foot">
    <span class="ed-status" id="edStatus">滚轮缩放 · 右键或空格拖动平移</span>
    <div class="ed-zoom">
      <button class="zb-btn" id="edZoomOut" title="缩小">−</button>
      <button class="zb-pct" id="edZoomPct" title="回到 100%">100%</button>
      <button class="zb-btn" id="edZoomIn" title="放大">+</button>
      <span class="zb-sep"></span>
      <button class="zb-btn zb-text" id="edZoomFit" title="适应窗口">适应</button>
      <button class="zb-btn zb-text" id="edZoomOne" title="原始大小">1:1</button>
    </div>
  </div>

  <div class="ed-save" id="edSavePanel" hidden>
    <div class="ed-save-card">
      <div class="ed-save-head">
        <h3>保存图片</h3>
        <button class="ed-icon" id="edSaveX" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
            <path d="m7 7 10 10M17 7 7 17"/>
          </svg>
        </button>
      </div>
      <label class="ed-field">
        <span>文件名</span>
        <input id="edSaveName" class="ed-input" type="text" spellcheck="false" autocomplete="off">
      </label>
      <label class="ed-field">
        <span>格式</span>
        <select id="edSaveFmt" class="ed-select">
          <option value="jpg">JPEG · 体积小</option>
          <option value="png">PNG · 无损</option>
        </select>
      </label>
      <div class="ed-quality" id="edQualityRow">
        <span>画质 <em id="edQualityVal">92</em></span>
        <input id="edQuality" type="range" min="60" max="100" step="1" value="92">
      </div>
      <div class="ed-save-info" id="edSaveInfo"></div>
      <label class="ed-check">
        <input type="checkbox" id="edOverwrite">
        <span>覆盖原文件<em>（原图将被替换，无法恢复）</em></span>
      </label>
      <div class="ed-save-acts">
        <button class="ed-btn" id="edSaveCancel">取消</button>
        <button class="ed-btn primary" id="edSaveGo">保存</button>
      </div>
    </div>
  </div>
</div>


<script src="/static/app.js?v=0"></script>
<script src="/static/editor.js?v=0"></script>
</body>
</html>
